<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Administrativo · SCOSIE</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="sie-protegida bg-surface text-on-surface font-sans antialiased">
  <!-- Sidebar y barra superior los inserta js/layout.js -->
  <main id="sie-main" class="sie-main">
    <div class="px-margin-mobile md:px-margin xl:px-margin-desktop py-space-xl flex flex-col gap-space-xl max-w-[1600px]">

      <!-- Encabezado -->
      <header class="flex flex-col lg:flex-row lg:items-end gap-space-lg">
        <div class="flex-1">
          <p class="text-label-sm uppercase text-secondary tracking-wider">SCOSIE · Gestión operativa</p>
          <h1 class="mt-space-xs text-headline-xl-mobile md:text-headline-xl text-primary">Dashboard administrativo</h1>
        </div>
        <div class="flex flex-wrap gap-space-sm">
          <a href="personal.html" class="inline-flex items-center gap-space-xs h-12 md:h-10 px-space-lg rounded border border-slate-300 bg-white hover:bg-slate-50 hover:border-slate-400 text-primary-container text-label-md">
            <span class="material-symbols-outlined text-[20px]">person_add</span>Alta de personal
          </a>
          <a href="obras.html?nueva=1" class="inline-flex items-center gap-space-xs h-12 md:h-10 px-space-lg rounded bg-primary-container hover:bg-nav text-white text-label-md">
            <span class="material-symbols-outlined text-[20px]">add_circle</span>Registrar nueva obra
          </a>
        </div>
      </header>

      <!-- Aviso de bitácoras pendientes de sincronizar -->
      <div id="banner-bitacoras"></div>

      <!-- Resumen por catálogo -->
      <section id="resumen" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-gutter-sm md:gap-gutter" aria-label="Resumen"></section>

      <!-- Gráficas fila 1 -->
      <section class="grid grid-cols-1 lg:grid-cols-12 gap-gutter-sm md:gap-gutter">
        <article id="graf-presupuesto" class="lg:col-span-7 bg-surface-container-lowest border border-linea rounded-lg shadow-elev-1 p-space-lg"></article>
        <article id="graf-asistencia" class="lg:col-span-5 bg-surface-container-lowest border border-linea rounded-lg shadow-elev-1 p-space-lg"></article>
      </section>

      <!-- Gráficas fila 2 -->
      <section class="grid grid-cols-1 lg:grid-cols-12 gap-gutter-sm md:gap-gutter">
        <article id="materiales" class="lg:col-span-7 bg-surface-container-lowest border border-linea rounded-lg shadow-elev-1 p-space-lg"></article>
        <article id="graf-herramientas" class="lg:col-span-5 bg-surface-container-lowest border border-linea rounded-lg shadow-elev-1 p-space-lg"></article>
      </section>

      <!-- Actividad y préstamos -->
      <section class="grid grid-cols-1 lg:grid-cols-12 gap-gutter-sm md:gap-gutter">
        <article id="actividad" class="lg:col-span-7 bg-surface-container-lowest border border-linea rounded-lg shadow-elev-1 p-space-lg"></article>
        <article id="prestamos" class="lg:col-span-5 bg-surface-container-lowest border border-linea rounded-lg shadow-elev-1 p-space-lg"></article>
      </section>
    </div>
  </main>
  <script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
